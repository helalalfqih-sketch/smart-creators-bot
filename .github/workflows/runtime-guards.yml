name: Runtime Guards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q bot core engine job_queue api storage workers pipeline launcher.py bot.py main.py
      - name: Run runtime guard tests
        run: python -m unittest discover -s tests -p "test_*.py"
